name: "VDD CodeQL config"
#
# api/_vdd-core.cjs is generated by scripts/bundle-api.mjs from
# packages/vdd-mcp/dist/handler.js with esbuild, unminified, so it inlines
# third-party code — the MCP SDK, zod, ajv. None of that source lives in this
# repository (`@modelcontextprotocol/server` is an npm dependency), and nothing
# else here analyses it: the CodeQL job installs no dependencies, so
# node_modules does not exist when the database is created. Analysing the copy
# produced 333 alerts on the first PR that added it — including two high
# js/incomplete-sanitization findings in the SDK's URI-template code — and every
# regeneration would re-add them.
#
# Excluding the generated copy is an accepted risk recorded in docs/plan.md, not
# a claim that the same code is scanned elsewhere. This repository's own source
# under packages/ stays scanned; the bundle's integrity is held by
# `scripts/bundle-api.mjs --check` and hosted-bundle.test.ts rather than by a
# static scan of generated bytes.
queries:
  - uses: security-and-quality
paths-ignore:
  - api/_vdd-core.cjs
