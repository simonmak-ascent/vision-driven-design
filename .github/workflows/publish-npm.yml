name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      # A tag is not evidence the suite passed: CI runs on pull requests and pushes to
      # branches, and a tag push is a separate event. 2.0.0 shipped with a hosted endpoint
      # that returned 500 for every method, so the suite runs here, on the tree the tag
      # points at, before anything reaches the registry. What catches that class is
      # `hosted-bundle.test.ts` — added by the fix, not by this step: it rebuilds the
      # bundle from the dist just built and calls the real handler from a directory with
      # no `node_modules` above it, which is the deploy's own condition.
      - name: Check and test the tagged tree
        run: pnpm check && pnpm test

      - name: Publish packages
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `pnpm publish` rewrites `workspace:` deps; `npm publish` does not.
      # Fail the release if a published manifest is uninstallable (the 1.9.4 regression).
      - name: Verify published manifests
        run: node scripts/verify-publish.mjs
